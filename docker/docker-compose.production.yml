# Production network override for the Docker quickstart stack.
#
# Use only together with docker-compose.yml. It keeps administrative and
# service-to-service endpoints on loopback; publish the site and the login API
# through an HTTPS reverse proxy after the domain is configured.
services:
  db:
    ports: !override
      - "127.0.0.1:3307:3306"

  server:
    environment:
      # Production always runs the map released and checksumed by Zealot. Local
      # development keeps the editable map from docker-compose.yml unchanged.
      CANARY_MAP_URL: "${ZEALOT_MAP_URL:-https://github.com/Zealot-Server/canary/releases/download/zealot-map-2026-10-30/otservbr.otbm}"
      CANARY_MAP_SHA256: "${ZEALOT_MAP_SHA256:-928ec4c115b641953d99306abbd674fc06cb4b9b20606eecb40d7cd289d6e973}"
    ports: !override
      - "127.0.0.1:${CANARY_LOGIN_PORT:-7171}:${CANARY_LOGIN_PORT:-7171}"
      - "${CANARY_GAME_PORT:-7172}:${CANARY_GAME_PORT:-7172}"
      # Server listings query the Canary status protocol directly. It exposes
      # public server metadata only; database, web and login APIs stay private.
      - "${CANARY_STATUS_PORT:-7173}:${CANARY_STATUS_PORT:-7173}"

  myaac:
    ports: !override
      - "127.0.0.1:${MYAAC_HTTP_PORT:-8080}:80"

  login-server:
    ports: !override
      - "127.0.0.1:${LOGIN_HTTP_PORT:-8088}:${LOGIN_HTTP_PORT:-8088}"
      - "127.0.0.1:${LOGIN_GRPC_PORT:-9090}:${LOGIN_GRPC_PORT:-9090}"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    networks:
      - canary-net
    depends_on:
      myaac:
        condition: service_started
      login-server:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
