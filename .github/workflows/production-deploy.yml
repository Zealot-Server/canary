---
name: Production deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA already validated by CI
        required: true
        type: string

concurrency:
  group: canary-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated Canary image
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/opt/zealot/canary
            STACK_DIR=/opt/zealot/canary/docker
            TARGET_SHA='${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}'
            PREVIOUS_SHA="$(sudo git -C "$APP_DIR" rev-parse HEAD)"
            PREVIOUS_IMAGE="$(sudo docker inspect --format '{{.Image}}' otbr-server-1)"
            IMAGE="ghcr.io/zealot-server/canary:$TARGET_SHA"
            MYAAC_CHANGED=false

            rollback() {
              sudo git -C "$APP_DIR" reset --hard "$PREVIOUS_SHA"
              sudo env CANARY_IMAGE="$PREVIOUS_IMAGE" docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --no-deps --force-recreate server
              if [ "$MYAAC_CHANGED" = true ]; then
                sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --build --no-deps --force-recreate myaac
              fi
              sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --no-deps --force-recreate caddy
            }

            sudo git -C "$APP_DIR" fetch origin main
            sudo git -C "$APP_DIR" reset --hard "$TARGET_SHA"

            if ! sudo git -C "$APP_DIR" diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- docker/docker-compose.yml docker/quickstart/myaac; then
              MYAAC_CHANGED=true
            fi

            if ! sudo env CANARY_IMAGE="$IMAGE" docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" pull server; then
              rollback
              exit 1
            fi

            if ! sudo env CANARY_IMAGE="$IMAGE" docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --no-deps --force-recreate server; then
              rollback
              exit 1
            fi

            if [ "$MYAAC_CHANGED" = true ] && ! sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --build --no-deps --force-recreate myaac; then
              rollback
              exit 1
            fi

            # The public gateway mounts its Caddyfile from this repository.
            # Recreate it so performance and cache-header changes are live with
            # the validated Canary commit.
            if ! sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" up -d --no-deps --force-recreate caddy; then
              rollback
              exit 1
            fi

            for attempt in {1..30}; do
              if [ "$(sudo docker inspect --format '{{.State.Running}}' otbr-server-1)" = true ]; then
                echo "Deployed $TARGET_SHA"
                exit 0
              fi
              sleep 2
            done

            rollback
            exit 1
